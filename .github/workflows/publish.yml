name: publish

# Builds the static site into an OCI image and pushes it to GHCR.
# Release = push a v* tag (e.g. v1.0.0); the image gets the version tag
# (without the v prefix) plus :latest and :sha-<short>.
# The gitops-home-server repo deploys ghcr.io/leorossi/ndolobutto:<version>
# (the cluster pulls it with the ghcr-pull secret).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/leorossi/ndolobutto
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
